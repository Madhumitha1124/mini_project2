{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profile | Crop Recommendation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        background:
          linear-gradient(rgba(24, 80, 35, 0.62), rgba(24, 80, 35, 0.62)),
          url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80")
            center/cover no-repeat fixed;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .navbar {
        background: rgba(0, 0, 0, 0.1) !important;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .navbar-brand {
        color: white !important;
        font-weight: 700;
      }

      .lang-toggle-btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.55);
        color: white;
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        line-height: 1;
      }
      .lang-toggle-btn:hover {
        background: rgba(255,255,255,0.28);
      }

      .profile-container {
        padding: 40px 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 40px;
        margin-bottom: 30px;
      }

      .profile-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .profile-avatar {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #2f8f46 0%, #24683a 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 48px;
        color: white;
      }

      .profile-header h1 {
        color: #333;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .profile-info {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .profile-info p {
        margin: 10px 0;
        color: #666;
      }

      .profile-info strong {
        color: #333;
        font-weight: 600;
      }

      .btn-logout {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-weight: 600;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-logout:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        color: white;
      }

      .btn-back {
        background: linear-gradient(135deg, #2f8f46 0%, #24683a 100%);
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-weight: 600;
        color: white;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-block;
        margin-right: 10px;
      }

      .btn-back:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(47, 143, 70, 0.4);
        color: white;
        text-decoration: none;
      }

      .action-buttons {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark d-flex justify-content-between align-items-center px-4">
      <div class="navbar-brand" data-i18n="nav.brand">
        <i class="fas fa-leaf"></i> AI-Based Crop Recommendation System
      </div>
      <button class="lang-toggle-btn" onclick="i18nToggle()">தமிழ்</button>
    </nav>

    <div class="profile-container">
      <div class="card">
        <div class="profile-header">
          <div class="profile-avatar">
            <i class="fas fa-user-circle"></i>
          </div>
          <h1>Welcome, {{ user.username }}!</h1>
          <p style="color: #999; margin: 0" data-i18n="profile.manage">Manage your account</p>
        </div>

        <div class="profile-info">
          <p>
            <strong><i class="fas fa-user"></i> <span data-i18n="profile.username_lbl">Username:</span></strong><br />
            {{ user.username }}
          </p>
          <p>
            <strong><i class="fas fa-envelope"></i> <span data-i18n="profile.email_lbl">Email:</span></strong><br />
            {{ user.email }}
          </p>
          <p>
            <strong><i class="fas fa-calendar"></i> <span data-i18n="profile.joined">Member Since:</span></strong><br />
            {{ user.date_joined|date:"F d, Y" }}
          </p>
        </div>

        <div class="action-buttons">
          <a href="{% url 'index' %}" class="btn btn-back" data-i18n="profile.back">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
          <form
            method="POST"
            action="{% url 'logout' %}"
            style="display: inline"
          >
            {% csrf_token %}
            <button type="submit" class="btn btn-logout" data-i18n="profile.logout">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/i18n.js' %}"></script>
  </body>
</html>
