{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | Crop Recommendation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        background:
          linear-gradient(rgba(24, 80, 35, 0.62), rgba(24, 80, 35, 0.62)),
          url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80")
            center/cover no-repeat fixed;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 40px;
        width: 100%;
        max-width: 400px;
      }

      .card-title {
        color: #333;
        font-weight: 700;
        margin-bottom: 30px;
        font-size: 28px;
        text-align: center;
      }

      .form-control {
        border-radius: 12px;
        border: 2px solid #e0e0e0;
        padding: 12px 16px;
        font-size: 14px;
        transition: all 0.3s ease;
        margin-bottom: 16px;
      }

      .form-control:focus {
        border-color: #2f8f46;
        box-shadow: 0 0 0 0.2rem rgba(47, 143, 70, 0.25);
        outline: none;
      }

      .form-control::placeholder {
        color: #999;
      }

      .btn-login {
        background: linear-gradient(135deg, #44a85d 0%, #2b7f42 100%);
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        color: white;
        width: 100%;
        margin-top: 10px;
        transition: all 0.3s ease;
        font-size: 16px;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(47, 143, 70, 0.4);
        color: white;
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .alert {
        border-radius: 12px;
        border: none;
        margin-bottom: 20px;
        padding: 12px 16px;
      }

      .alert-danger {
        background-color: #ffe5e5;
        color: #c3245d;
      }

      .alert-success {
        background-color: #e5f5e5;
        color: #0d7a3d;
      }

      .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .register-link a {
        color: #2f8f46;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .register-link a:hover {
        color: #2b7f42;
        text-decoration: underline;
      }

      .icon-container {
        text-align: center;
        margin-bottom: 20px;
        font-size: 48px;
        color: #2f8f46;
      }

      .form-group {
        position: relative;
        margin-bottom: 16px;
      }

      .form-label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }

      .navbar {
        background: rgba(0, 0, 0, 0.1) !important;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding: 15px 20px;
      }

      .navbar-brand {
        color: white !important;
        font-weight: 700;
        font-size: 18px;
      }

      .lang-toggle-btn {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.55);
        color: white;
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        line-height: 1;
      }
      .lang-toggle-btn:hover {
        background: rgba(255,255,255,0.28);
      }

      @media (max-width: 576px) {
        .card {
          padding: 30px 20px;
        }

        .card-title {
          font-size: 24px;
          margin-bottom: 20px;
        }

        .icon-container {
          font-size: 40px;
          margin-bottom: 15px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark d-flex justify-content-between align-items-center px-4">
      <span class="navbar-brand" data-i18n="nav.brand">
        <i class="fas fa-leaf"></i> AI-Based Crop Recommendation System
      </span>
      <button class="lang-toggle-btn" onclick="i18nToggle()">தமிழ்</button>
    </nav>

    <div class="login-container">
      <div class="card">
        <div class="icon-container">
          <i class="fas fa-seedling"></i>
        </div>

        <h2 class="card-title" data-i18n="login.title">Login</h2>

        {% if messages %}
        {% for message in messages %}
        <div
          class="alert {% if 'error' in message.tags %}alert-danger{% else %}alert-success{% endif %} py-2"
        >
          {% if 'error' in message.tags %}
          <i class="fas fa-exclamation-circle"></i>
          {% else %}
          <i class="fas fa-check-circle"></i>
          {% endif %} {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label class="form-label" for="username" data-i18n="login.username">
              <i class="fas fa-user"></i> Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              data-i18n="login.username_ph"
              placeholder="Enter your username"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password" data-i18n="login.password">
              <i class="fas fa-lock"></i> Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              data-i18n="login.password_ph"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="btn btn-login" data-i18n="login.btn">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>

        <div class="register-link">
          <span data-i18n="login.no_account">Don't have an account?</span>
          <a href="{% url 'register' %}">
            <i class="fas fa-arrow-right"></i> <span data-i18n="login.register_link">Register here</span>
          </a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/i18n.js' %}"></script>
  </body>
</html>
